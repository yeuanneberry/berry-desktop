# Berry terminal palette.
font_family JetBrains Mono
font_size 11.0
shell_integration enabled
linux_display_server wayland
scrollback_lines 10000
enable_audio_bell no
window_padding_width 8
background_opacity 0.88
dynamic_background_opacity yes
cursor_shape beam
cursor_blink_interval 0
tab_bar_style separator
foreground #d9d4c5
background #191c1c
selection_foreground #eee8d9
selection_background #363d3b
cursor #c3ac77
url_color #8e977b
active_border_color #8e977b
inactive_border_color #363d3b
color0 #191c1c
color1 #b47870
color2 #8e977b
color3 #c3ac77
color4 #82999b
color5 #a295a6
color6 #91a89b
color7 #d9d4c5
color8 #636b62
color9 #c88c82
color10 #a5af8e
color11 #d2bd8e
color12 #9eb3b5
color13 #b7a9b9
color14 #a9c0b3
color15 #eee8d9
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
# Add a local include after this file if you want personal overrides.
